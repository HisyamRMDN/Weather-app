<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather-App</title>
        <!-- custom css -->
        <link rel="stylesheet" href="./assets/css/style.css" />
        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" />
        <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" />
        <link rel="preconnect" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" />
        <!-- Icon -->
        <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

        <!-- custom js -->
        <script src="./assets/js/app.js" type="module"></script>
        <script src="./assets/js/route.js" type="module"></script>
    </head>
    <body>
        <!-- HEADER -->
        <header class="header">
            <div class="container">
                <a href="#" class="logo">
                    <img src="./assets/images/logo.png" width="364" height="58" alt="logo" class="logo" />
                </a>
                <div class="search-view active" data-search-view>
                    <div class="search-wrapper">
                        <input
                            type="search"
                            name=""
                            id=""
                            class="search-field"
                            placeholder="Search for a city or country..."
                            autocomplete="off"
                            data-search-field />
                        <span class="m-icon">search</span>
                        <button class="icon-btn leading-icon has-state" aria-label="close search" data-search-togglers>
                            <span class="m-icon">arrow_back</span>
                        </button>
                    </div>
                    <div class="search-result" data-search-result>
                        <ul class="view-list" data-result-list>
                            <li class="view-item">
                                <span class="m-icon">location_on</span>
                                <div>
                                    <p class="item-title">london</p>
                                    <p class="label-2 item-subtitle">United Kingdom</p>
                                </div>

                                <a href="#" class="item-link has-state" data-search-togglers></a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="icon-btn has-state" aria-label="open search" data data-search-togglers="">
                        <span class="m-icon icon">search</span>
                    </button>
                    <a href="#/current-location" class="btn-primary has-state" data-current-location disabled>
                        <span class="m-icon icon">my_location</span>
                        <span class="span">current location</span>
                    </a>
                </div>
            </div>
        </header>
    </body>
</html>
