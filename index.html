<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather-App</title>
        <!-- custom css -->
        <link rel="stylesheet" href="./assets/css/style.css" />
        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" />
        <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" />
        <link rel="preconnect" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" />
        <!-- Icon -->
        <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

        <!-- custom js -->
        <script src="./assets/js/app.js" type="module"></script>
        <script src="./assets/js/route.js" type="module"></script>
    </head>
    <body>
        <!-- HEADER -->
        <header class="header">
            <div class="container" data-container>
                <a href="#" class="logo">
                    <img src="./assets/images/logo.png" width="364" height="58" alt="logo" class="logo" />
                </a>
                <div class="search-view" data-search-view>
                    <div class="search-wrapper">
                        <input type="search" name="" id="" class="search-field" placeholder="Search for a city or country..." autocomplete="off" data-search-field />
                        <span class="m-icon leading-icon">search</span>
                        <button class="icon-btn leading-icon has-state" aria-label="close search" data-search-togglers>
                            <span class="m-icon">arrow_back</span>
                        </button>
                    </div>
                    <div class="search-result" data-search-result></div>
                </div>

                <div class="header-actions">
                    <button class="icon-btn has-state" aria-label="open search" data data-search-togglers="">
                        <span class="m-icon icon">search</span>
                    </button>
                    <a href="#/current-location" class="btn-primary has-state" data-current-location-btn>
                        <span class="m-icon icon">my_location</span>
                        <span class="span">current location</span>
                    </a>
                </div>
            </div>
        </header>

        <main>
            <article class="container">
                <div class="content-left">
                    <!-- CURRENT WEATHER -->
                    <section class="section current-weather" aria-label="current-weather" data-current-weather></section>
                    <!-- CURRENT WEATHER -->
                    <!-- FORECAST -->
                    <section class="forecast section" aria-label="forecast" data-5-day-forecast></section>
                </div>

                <div class="content-right">
                    <!-- HIGHLIGHT -->
                    <section class="section highlights" aria-labelledby="highlights-label" data-highlights></section>

                    <!-- HOURLY FORECAST -->
                    <section class="section hourly-forecast" aria-label="hourly forecast label" data-hourly-forecast></section>

                    <!-- FOOTER -->
                    <footer class="footer">
                        <p class="body-3">copyright © 2023 Weather-App all rights reserved</p>
                        <p class="body-3">
                            powered by
                            <a href="https://openweathermap.org/api" title="open weather map api" target="_blank" rel="noopener"></a
                            ><img src="./assets/images/openweather.png" height="30" loading="lazy" width="150" alt="open weather map api" class="logo" />
                        </p>
                    </footer>
                </div>

                <div class="loading" data-loading></div>
            </article>
        </main>

        <!-- 404 NOT FOUND -->
        <section class="error-content" data-error-content>
            <h2 class="heading">404</h2>
            <p class="body-1">Page not found</p>
            <a href="#/weather?lat=-6.40719&lon=106.7535" class="btn-primary"><span class="span">Go back home</span></a>
        </section>
    </body>
</html>
